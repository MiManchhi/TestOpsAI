name: testops-ai
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testops}
      MYSQL_USER: ${MYSQL_USER:-testops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.ps1 first}
      TZ: UTC
    ports: ['127.0.0.1:3306:3306']
    volumes: ['mysql-data:/var/lib/mysql']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  redis:
    image: redis:7.4.8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1 first}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.17.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run scripts/setup.ps1 first}
    ports: ['127.0.0.1:6333:6333']
    volumes: ['qdrant-data:/qdrant/storage']
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3;
          head -1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 10
  ai-service:
    build:
      context: apps/ai-service
    expose: ['8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    build:
      context: apps/server
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testops}
      MYSQL_USER: ${MYSQL_USER:-testops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup.ps1 first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.ps1 first}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1 first}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ['8080']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:8088:80']
    depends_on:
      server:
        condition: service_healthy
volumes:
  mysql-data:
  redis-data:
  qdrant-data:
