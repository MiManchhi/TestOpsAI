spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: testops-server
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:testops}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:testops}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          min-idle: 1
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
testopsai:
  workspace:
    object-root: ${TESTOPS_WORKSPACE_OBJECT_ROOT:.runtime/workspace-objects}
    ai-url: ${TESTOPS_WORKSPACE_AI_URL:}
    java-private-key: ${TESTOPS_WORKSPACE_JAVA_PRIVATE_KEY:}
    ai-public-key: ${TESTOPS_WORKSPACE_AI_PUBLIC_KEY:}
    embedding-profile: ${TESTOPS_WORKSPACE_EMBEDDING_PROFILE:default}
    index-worker-enabled: ${TESTOPS_WORKSPACE_INDEX_WORKER_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:?Set JWT_SECRET environment variable}
    expiration-minutes: 30
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
