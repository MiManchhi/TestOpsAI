[project]
name = "testops-ai-service"
version = "0.1.0"
description = "Internal AI service for TestOps AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1", "robotframework>=7.3,<8", "defusedxml==0.7.1", "pyjwt[crypto]>=2.10,<3",
    "pypdf>=6.21.4,<7", "qdrant-client>=1.17,<1.18", "filelock>=3.20,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4,<5", "types-defusedxml>=0.7,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
