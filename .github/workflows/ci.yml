name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.4
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh ./mvnw -B -ntp verify
        working-directory: apps/server
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --config pyproject.toml ../../scripts/smoke-local.py
      - run: uv run --locked ruff format --check --config pyproject.toml ../../scripts/smoke-local.py
      - run: uv run --locked mypy
      - name: Type-check smoke script for Linux and Windows
        run: |
          for platform in linux win32; do
            uv run --locked mypy --strict --platform "$platform" ../../scripts/smoke-local.py
          done
      - run: uv run --locked pytest
      - run: uv build --out-dir dist
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository layout
        shell: pwsh
        run: ./scripts/check-layout.ps1
      - name: Check memory and rule navigation
        shell: pwsh
        run: ./scripts/memory.ps1 -Mode Check
      - name: Test repository layout rules
        shell: pwsh
        run: ./tests/engineering/check-layout.tests.ps1
      - run: docker compose config --quiet
        env:
          MYSQL_PASSWORD: ci-validation-only
          MYSQL_ROOT_PASSWORD: ci-validation-only
          REDIS_PASSWORD: ci-validation-only
          QDRANT_API_KEY: ci-validation-only
